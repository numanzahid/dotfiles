# LazyVim lean installer options.
# Edit before running ./lazyvim/install-lazyvim.sh

# Optional LazyVim language extras (official imports only).
ENABLE_DOCKER=true
ENABLE_MARKDOWN_TOOLS=false
ENABLE_VUE=false
ENABLE_SVELTE=false
ENABLE_ASTRO=false
ENABLE_ANGULAR=false

# Web tooling: stop if node/npm missing (install Node via your dev-runtime installer).
REQUIRE_NODE=true

# Allow running as root on single-user hosts (e.g. test CTs). Default: refuse root.
LAZYVIM_ALLOW_ROOT=false

# Apt cache cleanup after system package install (good for containers).
APT_CLEAN_AFTER_INSTALL=true
