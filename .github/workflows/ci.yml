name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # Hard gate: shellcheck's "error" severity is almost always a real bug
      # (unbalanced quoting, undefined behavior, etc.), not a style opinion.
      - name: shellcheck (error severity, blocking)
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 > /tmp/sh-files
          printf '%s\0' scripts/dotfiles >> /tmp/sh-files
          xargs -0 shellcheck -S error < /tmp/sh-files

      # Informational only: "warning" severity includes real style/simplify
      # findings worth fixing over time (SC2034 unused vars, SC2155, ...),
      # but this codebase hasn't been triaged against it yet -- see
      # analysis/FINDINGS.md item 5.2. Report without failing the build.
      - name: shellcheck (warning severity, non-blocking)
        if: always()
        run: |
          xargs -0 shellcheck -S warning < /tmp/sh-files || echo "::warning::shellcheck reported warning-level findings (non-blocking); see job output above"

  dry-run-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu (devbox.sh)
            image: ubuntu:24.04
            script: ./devbox.sh
          - name: fedora (desktop.sh)
            image: fedora:latest
            script: ./desktop.sh
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install git and sudo (container images are minimal)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y git sudo
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git sudo
          fi

      - uses: actions/checkout@v4

      - name: Create a non-root user to run the installer as
        run: |
          if ! id ci-runner >/dev/null 2>&1; then
            useradd -m -s /bin/bash ci-runner
          fi
          echo 'ci-runner ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci-runner
          chmod 0440 /etc/sudoers.d/ci-runner
          chown -R ci-runner:ci-runner "$GITHUB_WORKSPACE"

      # --configs-only skips all package-manager/software install steps, so
      # this exercises the symlink/copy/journal logic (the most likely place
      # for a regression to silently break a fresh install) without the
      # network- and time-cost of a full software matrix.
      - name: "${{ matrix.script }} --configs-only --dry-run --yes"
        run: su -l ci-runner -c "cd '$GITHUB_WORKSPACE' && ${{ matrix.script }} --configs-only --dry-run --yes"

      - name: Real configs-only install, then dotfiles status
        run: |
          su -l ci-runner -c "cd '$GITHUB_WORKSPACE' && ${{ matrix.script }} --configs-only --yes"
          su -l ci-runner -c "dotfiles status" || true
