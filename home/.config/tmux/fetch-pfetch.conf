# Tmux pane/window bindings with pfetch banner.
# Enabled by: scripts/enable-tmux-fetch.sh pfetch
# Edit pfetch settings in: ~/.config/pfetch/pfetchrc

bind c new-window -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v pfetch >/dev/null 2>&1 && pfetch; exec bash -l'"
bind % split-window -h -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v pfetch >/dev/null 2>&1 && pfetch; exec bash -l'"
bind '"' split-window -v -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v pfetch >/dev/null 2>&1 && pfetch; exec bash -l'"
