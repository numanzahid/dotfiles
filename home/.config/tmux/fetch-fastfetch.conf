# Tmux pane/window bindings with fastfetch banner.
# Enabled by: ./install-fetch.sh fastfetch
# Layout: ~/.config/tmux/fastfetch.jsonc
# Text art: ~/.local/share/dotfiles/fastfetch-art (0=none, 1=tmux logo, 2=custom)

bind c new-window -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"
bind % split-window -h -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"
bind '"' split-window -v -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"
