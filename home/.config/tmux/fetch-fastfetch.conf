# Tmux pane/window bindings with fastfetch banner.
# Enabled by: ./install-fetch.sh fastfetch
# Edit fastfetch layout in: ~/.config/tmux/fastfetch.jsonc

bind c new-window -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && fastfetch --config ~/.config/tmux/fastfetch.jsonc; exec bash -l'"
bind % split-window -h -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && fastfetch --config ~/.config/tmux/fastfetch.jsonc; exec bash -l'"
bind '"' split-window -v -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && fastfetch --config ~/.config/tmux/fastfetch.jsonc; exec bash -l'"
