# Edit this repo file; workstation installers symlink it.
# Optional omarchy theme (uncomment when that file exists; kitty errors if missing):
# include ~/.local/state/omarchy/current/theme/kitty.conf

# Font (CaskaydiaCove from ./scripts/cascadia-nerd-font-install-update.sh -> dotfiles-caskaydia-cove)
font_family CaskaydiaCove Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

# Kitty graphics protocol (snacks.nvim image, lazyvim). Needs tmux allow-passthrough on.

# Window
window_padding_width 14
initial_window_width 150c
initial_window_height 42c
# Alacritty "Buttonless" has no exact kitty equivalent on all platforms.
hide_window_decorations no
background_opacity 0.95
background_blur 32
confirm_os_window_close 0

# Cursor styling
cursor_shape block
cursor_blink_interval 0

# Mouse scrolling
wheel_scroll_multiplier 0.95

# Keyboard
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \x1b[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \x1b[13;4u
