# Edit this repo file; workstation installers symlink it.

[general]
live_config_reload = true

# xterm-256color everywhere (local + SSH). Fine for tmux-heavy workflow; no remote alacritty terminfo.
[env]
TERM = "xterm-256color"

# Font (CaskaydiaCove from ./scripts/cascadia-nerd-font-install-update.sh -> dotfiles-caskaydia-cove)
[font]
size = 13.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

# Window
[window]
dynamic_title = true
padding.x = 14
padding.y = 14
decorations = "Buttonless"
opacity = 0.95
blur = true

[window.dimensions]
columns = 150
lines = 42

# Cursor styling
[cursor.style]
shape = "Block"
blinking = "Off"

# Alacritty multiplier is lines per notch (default 3).
[scrolling]
multiplier = 3
