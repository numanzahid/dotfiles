# Edit this repo file; workstation installers symlink it.
# Optional omarchy theme (uncomment when that file exists; Alacritty errors if missing):
# [general]
# import = ["~/.local/state/omarchy/current/theme/alacritty.toml"]

[general]
live_config_reload = true

# Font (CaskaydiaCove from ./scripts/cascadia-nerd-font-install-update.sh -> dotfiles-caskaydia-cove)
[font]
size = 13.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

# Window
[window]
dynamic_title = true
padding.x = 14
padding.y = 14
decorations = "Buttonless"
opacity = 0.95
blur = true

[window.dimensions]
columns = 150
lines = 42

# Cursor styling
[cursor.style]
shape = "Block"
blinking = "Off"

# Alacritty multiplier is lines per notch (default 3).
[scrolling]
multiplier = 3

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
  # Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001b[13;4u" },
]
