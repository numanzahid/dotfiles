# Edit this repo file; devbox.sh/desktop.sh (and dotfiles update) copy it to
# ~/.config/alacritty. Copied, not linked, so DMS or another tool rewriting the
# file never touches the repo; the next update restores this version.
# Colors: dotfiles-theme.toml (fixed; DMS writes dank-theme.toml, which is not imported).

[general]
live_config_reload = true
import = ["~/.config/alacritty/dotfiles-theme.toml"]

# xterm-256color everywhere (local + SSH). Fine for tmux-heavy workflow; no remote alacritty terminfo.
[env]
TERM = "xterm-256color"

# Font (CaskaydiaCove from `dotfiles install fonts` -> dotfiles-caskaydia-cove)
[font]
size = 13.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

# Window
[window]
dynamic_title = true
padding.x = 14
padding.y = 14
decorations = "Buttonless"
opacity = 1
blur = true

# Cursor styling
[cursor.style]
shape = "Block"
blinking = "Off"

# Alacritty multiplier is lines per notch (default 3).
[scrolling]
multiplier = 3

[mouse]
hide_when_typing = true

[bell]
duration = 0

# Shift+Enter inserts a newline (multi-line prompts in Claude Code and Codex).
[keyboard]
bindings = [
  { key = "Enter", mods = "Shift", chars = "\n" },
]
