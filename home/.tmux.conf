##### Clipboard / terminal integration #################################

# Allow OSC52 clipboard copy from apps inside tmux, like nvim.
set -s set-clipboard on
# Passthrough is for image protocols; optional via ~/.config/tmux/image-passthrough.conf
set -g allow-passthrough off

# True color support.
set -g default-terminal "tmux-256color"

# Truecolor support for the outer terminal and tmux terminfo.
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"

# Compatibility fallback for older apps/tmux terminfo checks.
set -as terminal-overrides ",xterm-kitty:Tc"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",tmux-256color:Tc"
set -as terminal-overrides ",screen-256color:Tc"

# extended-keys can confuse some SSH/web terminals; enable only when needed.
# set -g extended-keys on

##### General behavior ##################################################

# Mouse support. Wheel scrolls tmux scrollback instead of shell history.
set -g mouse on

# Start windows and panes at 1.
set -g base-index 1
setw -g pane-base-index 1

# Reorder windows after deleting one.
set -g renumber-windows on

# LazyVim / nvim friendliness.
set-option -sg escape-time 10
set-option -g focus-events on

# Faster redraws and less laggy feeling, especially over SSH.
set -g assume-paste-time 1
set -g repeat-time 300

# Longer scrollback.
set -g history-limit 200000

# Do not detach from tmux when a session is destroyed.
set -g detach-on-destroy off

# Resize aggressively when clients have different sizes.
setw -g aggressive-resize on

##### Copy mode #########################################################

# Vi-style copy mode.
setw -g mode-keys vi

# Keep copy indicators on the status line only (no extra pane-border status bar).
setw -g pane-border-status off

# Vim-like selection/copy in copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel


##### Default-key-compatible tmux behavior ##############################

# Fastfetch on new window/pane. Use ~ not #{HOME}: tmux 3.3.
bind c new-window -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && [ -x ~/.config/tmux/fastfetch-banner.sh ] && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"
bind % split-window -h -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && [ -x ~/.config/tmux/fastfetch-banner.sh ] && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"
bind '"' split-window -v -c "#{pane_current_path}" "env NO_FETCH=1 bash -lc 'command -v fastfetch >/dev/null 2>&1 && [ -x ~/.config/tmux/fastfetch-banner.sh ] && ~/.config/tmux/fastfetch-banner.sh; exec bash -l'"

# Kill pane no confirmation
bind x kill-pane

# Keep default kill-window key, with confirmation.
# bind & confirm-before -p "kill-window #W? (y/n)" kill-window

##### Status bar ########################################################
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-keys vi
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator " "

# Normal command-based window names, like zsh, bash, nvim, ssh.
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'

##### Theme ###############################################
set -g status-style "bg=brightblue,fg=black"

# Left: session name.
set -g status-left "#[fg=black,bg=brightgreen,bold] #S "

# Right: date/time, copy/prefix, then hostname (same chip as session name).
set -g status-right "#[fg=black] %d-%m-%y %H:%M #{?pane_in_mode,#[fg=#ffffff bg=black bold]  COPY  #[default],}#{?client_prefix,#[fg=black bg=#ffffff bold]  PREFIX  #[default],}#[fg=black,bg=brightgreen,bold] #h "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#ffffff,bold] #I:#W "

set -g pane-border-style "fg=brightblue"
set -g pane-active-border-style "fg=brightyellow"

set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"

setw -g clock-mode-colour blue

##### Plugins ###########################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'
# Extra programs on top of resurrect defaults (vi/vim/nvim/htop/...).
# ~ matches the name anywhere in the saved command (full paths).
set -g @resurrect-processes '~lazygit ~lazydocker ~btop ~htop'

run-shell 'test -x ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/tpm'

# Optional Kitty graphics (./scripts/kitty-image-support-install-update.sh)
source-file -F "#{HOME}/.config/tmux/image-passthrough.conf"
